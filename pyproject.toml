[project]
name = "supply-agents"
version = "0.1.0"
description = "Supply chain multi-agent system (Google ADK) — MVP"
requires-python = ">=3.11"
dependencies = [
    "google-adk[db]>=1.0.0",
    "chromadb>=0.5.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
