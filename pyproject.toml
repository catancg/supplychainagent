[project]
name = "supply-agents"
version = "0.1.0"
description = "Supply chain multi-agent system (Google ADK) — MVP"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "chromadb>=0.5.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
